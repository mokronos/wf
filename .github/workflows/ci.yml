name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
        env:
          X_ENGAGEMENT_REAL_X: "0"
      - run: bun run example:order-saga
      - run: bun run example:approval
      - run: bun run build
      - run: bun run build:marketing
      - run: bun run build:cli
