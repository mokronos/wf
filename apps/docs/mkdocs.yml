site_name: wf docs
site_description: Durable TypeScript workflows with the wf CLI and wfkit SDK.
site_url: https://mokronos.github.io/wf/docs/
repo_url: https://github.com/mokronos/wf
repo_name: mokronos/wf
edit_uri: edit/main/apps/docs/docs/

# Built into the marketing site's output so GitHub Pages serves both from one
# artifact. Astro clears dist/, so `build:marketing` has to run first.
site_dir: ../marketing/dist/docs

theme:
  name: material
  font:
    text: Manrope
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra:
  # Clicking the logo goes back to the marketing site rather than to /docs/.
  homepage: https://mokronos.github.io/wf/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mokronos/wf

nav:
  - Overview: index.md
  - wf CLI: cli.md
  - TypeScript SDK: wfkit.md
  - Home ↗: https://mokronos.github.io/wf/

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets

plugins:
  - search
